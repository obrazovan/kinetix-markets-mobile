name: kinetix_markets
description: TradingView-inspired cross-platform mobile trading terminal for Stocks, Crypto, and Forex with 7D/30D analytics and offline cache.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  material_ui: ^1.1.0
  shared_preferences: ^2.3.0
  xml: ^6.5.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
